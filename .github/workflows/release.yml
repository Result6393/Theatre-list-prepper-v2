name: Release offline file

# Push a tag like v1.0.0 to publish the single-file app as a downloadable release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches the app version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cp dist/index.html "theatre-list-prepper-$GITHUB_REF_NAME.html"
      - run: gh release create "$GITHUB_REF_NAME" "theatre-list-prepper-$GITHUB_REF_NAME.html" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
